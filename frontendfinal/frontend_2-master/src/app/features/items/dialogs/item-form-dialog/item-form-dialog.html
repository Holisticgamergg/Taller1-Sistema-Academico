<div class="p-8 w-full flex flex-col items-center justify-center bg-white">
  <div class="mb-6 text-center w-full max-w-2xl">
    <h1 class="text-3xl font-extrabold text-[#0A1C2C]">{{ isEditing ? 'Editar Item' : 'Nuevo Item' }}</h1>
  </div>

  <form [formGroup]="itemForm" class="w-full max-w-2xl bg-white">
    <div class="space-y-2">
      <label for="nombre" class="block text-sm font-medium text-gray-700">Nombre</label>
      <input
        type="text"
        id="nombre"
        formControlName="nombre"
        class="input w-full"
        placeholder="Ej: Item de evaluación"
      />
      @if (itemForm.get('nombre')?.hasError('required') && itemForm.get('nombre')?.touched) {
        <span class="text-xs text-red-600">El nombre es requerido</span>
      }
      @if (itemForm.get('nombre')?.hasError('minlength') && itemForm.get('nombre')?.touched) {
        <span class="text-xs text-red-600">El nombre debe tener al menos 3 caracteres</span>
      }
    </div>

    <div class="flex flex-row justify-center gap-20 pt-4 border-t border-gray-200 mt-6">
      <button type="button" (click)="onCancel()" class="btn btn-error text-white font-medium">
        Cancelar
      </button>
      <button
        type="button"
        (click)="onSubmit()"
        [disabled]="!itemForm.valid"
        class="btn bg-[#007A5E] hover:bg-[#00624b] text-white font-medium"
      >
        {{ isEditing ? 'Actualizar' : 'Crear' }}
      </button>
    </div>
  </form>
</div>
