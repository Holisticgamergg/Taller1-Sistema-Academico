<div class="container mx-auto p-4">
  <div class="bg-white rounded-lg shadow-lg p-6">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6 border-b pb-4">
      <h1 class="text-3xl font-bold text-[#0A1C2C]">Gestión de Usuarios</h1>
      <div class="flex gap-3">
        <button
          type="button"
          (click)="onPrintList()"
          title="Imprimir listado actual"
          class="btn bg-white hover:bg-gray-100 text-[#0A1C2C] border border-gray-300 font-medium flex items-center gap-2 px-4 shadow-sm"
        >
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6.72 13.829c-.24.03-.48.062-.72.096m.72-.096a42.415 42.415 0 0 1 10.56 0m-10.56 0L6.34 18m10.94-4.171c.24.03.48.062.72.096m-.72-.096L17.66 18m0 0 .229 2.523a1.125 1.125 0 0 1-1.12 1.227H7.231c-.662 0-1.18-.568-1.12-1.227L6.34 18m11.318 0h1.091A2.25 2.25 0 0 0 21 15.75V9.456c0-1.081-.768-2.015-1.837-2.175a48.055 48.055 0 0 0-1.913-.247M6.34 18H5.25A2.25 2.25 0 0 1 3 15.75V9.456c0-1.081.768-2.015-1.837-2.175a48.041 48.041 0 0 1 1.913-.247m10.5 0a48.536 48.536 0 0 0-10.5 0m10.5 0V3.375c0-.621-.504-1.125-1.125-1.125h-8.25c-.621 0-1.125.504-1.125 1.125v3.659M18 10.5h.008v.008H18V10.5Zm-3 0h.008v.008H15V10.5Z" />
          </svg>
          Imprimir
        </button>
        <button
          type="button"
          class="btn bg-[#007A5E] hover:bg-[#00624b] text-white font-medium flex items-center gap-2"
          (click)="opneDialogPersonalRegister()"
        >
          <mat-icon fontSet="material-symbols-outlined">add</mat-icon>
          Nuevo Personal
        </button>
      </div>
    </div>

    <!-- Filtros -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
      <!-- Filtro de búsqueda -->
      <div class="form-control">
        <label class="label">
          <span class="label-text font-medium">Buscar Usuario</span>
        </label>
        <input
          type="text"
          placeholder="Buscar usuario..."
          class="input input-bordered w-full"
          #input
          (keyup)="query.set(input.value)"
        />
      </div>

      <!-- Tipo de Personal -->
      <div class="form-control">
        <label class="label">
          <span class="label-text font-medium">Tipo de Personal</span>
        </label>
        <select
          class="select select-bordered w-full"
          (change)="onSelectChanges($event)"
        >
          <option disabled selected>Seleccione</option>
          <option value="T">Todos</option>
          <option value="A">Administrativos</option>
          <option value="P">Público</option>
          <option value="E">Estudiantes</option>
        </select>
      </div>

      <!-- Filtro por Estado -->
      <div class="form-control md:col-span-2">
        <label class="label">
          <span class="label-text font-medium">Estado</span>
        </label>
        <div class="flex items-center gap-6 h-12">
          <label class="flex items-center gap-2 cursor-pointer">
            <input
              type="radio"
              name="estado"
              value="2"
              class="radio radio-sm radio-primary"
              checked
              (change)="onRadioChanges($event)"
            />
            <span class="text-sm">Todos</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input
              type="radio"
              name="estado"
              value="1"
              class="radio radio-sm radio-primary"
              (change)="onRadioChanges($event)"
            />
            <span class="text-sm">Activos</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input
              type="radio"
              name="estado"
              value="0"
              class="radio radio-sm radio-primary"
              (change)="onRadioChanges($event)"
            />
            <span class="text-sm">Bajas</span>
          </label>
        </div>
      </div>
    </div>

    <!-- Loading -->
    @if (isLoading()) {
      <div class="flex justify-center py-12">
        <span class="loading loading-spinner loading-lg text-primary"></span>
      </div>
    }

    <!-- Error de conexión -->
    @if (hasError() && !isLoading()) {
      <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
        <strong class="font-bold">Error de conexión!</strong>
        <span class="block sm:inline"> No se pudo conectar con el servidor. Verifica que el backend esté corriendo.</span>
      </div>
    }

    <!-- Lista de usuarios -->
    @if (!isLoading() && !hasError()) {
      <app-users-list-page [query]="query()" />
    }
  </div>
</div>
